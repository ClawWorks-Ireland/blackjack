# G8 CI (REQ-CFG-1). Runs PR code, so it gets no secrets and runs on a sandbox VM (REQ-CFG-3), never on the PC itself.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: [self-hosted, vm-sandbox]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          : no install_command in the overlay
          npm test
          node --test scripts/gates/*.test.js scripts/agents/*.test.js
