# G8 CI (REQ-CFG-1). Runs PR code, so it gets no secrets and runs on a GitHub-hosted runner.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          : no install_command in the overlay
          npm test
          node --test scripts/gates/*.test.js scripts/agents/*.test.js

  # Lints .github/workflows/ (not a required gate; informs reviewers and A7).
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - name: actionlint (official image, pinned)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
