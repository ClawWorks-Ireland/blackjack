# G9 human approval by tier (spec §6, REQ-GATE-1 input). Informational: merge.yml
# recomputes approvals itself. Deterministic, no Claude.
name: tier-approval
on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled, ready_for_review]
  workflow_run:
    workflows: [review-submitted]
    types: [completed]
permissions:
  contents: read
  pull-requests: write   # requests Delmar's review while a PR waits for his approval (team v2.12)
  issues: read
  statuses: write
jobs:
  tier-approval:
    # Label events matter only for the labels the gate reads: tier:N and tier2-cancel (team v2.13).
    if: >-
      github.event_name != 'pull_request_target' ||
      (github.event.pull_request.base.ref == 'main' &&
       (!contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) || startsWith(github.event.label.name, 'tier')))
    runs-on: [self-hosted, vm-keyed]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4   # base branch: RISK.md and PROJECT.md (REQ-CFG-3)
        with: { ref: main, persist-credentials: false }
      - name: PR number
        id: pr
        env:
          PR_EVENT: ${{ github.event.pull_request.number }}
          PR_RUN: ${{ github.event.workflow_run.pull_requests[0].number }}
        run: echo "n=${PR_EVENT:-$PR_RUN}" >> "$GITHUB_OUTPUT"
      - if: steps.pr.outputs.n != ''
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          node scripts/gates/gate.js tier-approval --pr ${{ steps.pr.outputs.n }}
          node scripts/gates/gate.js cooling --pr ${{ steps.pr.outputs.n }}
