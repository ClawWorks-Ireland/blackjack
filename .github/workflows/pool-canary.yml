# Pool canary (spec REQ-CFG-3): one tiny real job per runner label (the PC pool's and the sandbox VMs'), so the pool proves itself with
# real jobs (action download and unpack, the pre-job hook, node, the pinned Claude Code) before real
# work lands on it. Started by `agent-team-pool --canary` after every pool change. Runs no model.
name: pool-canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        label: [claude-jobs, claude-code, local-llm, vm-sandbox]
    runs-on: [self-hosted, "${{ matrix.label }}"]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: What jobs need
        env: { LABEL: "${{ matrix.label }}" }
        run: |
          node -e 'require("fs").writeFileSync("canary.txt", process.version)'
          test -s canary.txt
          if [ "$LABEL" = vm-sandbox ]; then
            gh --version | head -1; sudo -n true; docker version >/dev/null
            # The router accepts nothing from the sandbox side (it only forwards to public addresses).
            if timeout 4 bash -c 'echo > /dev/tcp/10.77.0.1/53' 2>/dev/null; then echo "::error::the sandbox VM reached its router"; exit 1; fi
            curl -fsS -m 10 -o /dev/null https://api.github.com
          else
            /opt/agent-team/claude/current/bin/claude --version
          fi
          git log -1 --format=%h
          if [ "$LABEL" = local-llm ]; then curl -fsS -m 10 http://localhost:11434/api/version; fi
          echo "canary on $LABEL: ok ($(id -un))"
