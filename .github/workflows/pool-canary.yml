# Pool canary (spec REQ-CFG-3): one tiny real job per runner label (the PC pool's and the sandbox VMs'), so the pool proves itself with
# real jobs (action download and unpack, the pre-job hook, node, the pinned Claude Code) before real
# work lands on it. Started by `agent-team-pool --canary` after every pool change. Runs no model.
name: pool-canary
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  canary:
    strategy:
      fail-fast: false
      matrix:
        label: [claude-jobs, claude-code, local-llm, vm-sandbox, vm-keyed]
    runs-on: [self-hosted, "${{ matrix.label }}"]
    timeout-minutes: 10
    steps:
      - name: Tools jobs use without a setup step (as on GitHub's hosted image)
        if: startsWith(matrix.label, 'vm-')
        run: |
          for t in node npm git gh jq curl python3 zip unzip sha256sum google-chrome; do command -v "$t" >/dev/null || { echo "::error::$t missing"; exit 1; }; done
          d=$(mktemp -d) && python3 -m venv "$d/v" && "$d/v/bin/python" -m pip --version >/dev/null && rm -rf "$d" || { echo "::error::python3 venv/pip missing"; exit 1; }
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: What jobs need
        env: { LABEL: "${{ matrix.label }}" }
        run: |
          node -e 'require("fs").writeFileSync("canary.txt", process.version)'
          test -s canary.txt
          if [ "$LABEL" = vm-sandbox ] || [ "$LABEL" = vm-keyed ]; then
            gh --version | head -1; sudo -n true
            # Each VM is alone on its own segment, and the router forwards to public addresses only: every
            # other VM and every router address must time out (exit 124), not answer or refuse.
            GW=$(ip -4 route show default | awk '{print $3; exit}')
            for s in 1 2 3 4 5 6 7 8; do
              for ip in "10.77.$s.1" "10.77.$s.2"; do
                [ "$ip" = "${GW%.1}.2" ] && continue   # this VM itself
                rc=0; timeout 3 bash -c "echo > /dev/tcp/$ip/22" 2>/dev/null || rc=$?
                [ "$rc" = 124 ] || { echo "::error::$LABEL VM got an answer from $ip (rc=$rc)"; exit 1; }
              done
            done
            retry() { local i=0 n d e; e=$(mktemp); while :; do "$@" 2>"$e" && { cat "$e" >&2; rm -f "$e"; return 0; }; if grep -qiE 'network is unreachable|no route to host|could not resolve host|no such host|server misbehaving|error connecting to|check your internet connection|connection refused|failed to connect|couldn.t connect|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|connect: ' "$e"; then n=7; elif [ -n "${RETRY_WRITE:-}" ]; then break; elif grep -qiE 'connection reset|ECONNRESET|socket hang up|i/o timeout|TLS handshake timeout|ETIMEDOUT|connection timed out|operation timed out|context deadline exceeded|Client.Timeout|unexpected EOF|SSL_ERROR_SYSCALL|recv failure|send failure' "$e"; then n=7; elif grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|returned error: (429|5[0-9][0-9])|bad gateway|service unavailable|gateway time-?out|something went wrong|rate limit|abuse detection|was submitted too quickly|timed? ?out|EOF' "$e"; then n=3; else break; fi; [ "$i" -lt "$n" ] || break; d=$((2 << i)); [ "$d" -gt 60 ] && d=60; echo "::warning::network call failed, retrying in about ${d}s (spec 1.3, exponential backoff): $1 $2" >&2; sleep $((d / 2 + RANDOM % (d / 2 + 1))); i=$((i + 1)); done; cat "$e" >&2; rm -f "$e"; return 1; }
            # A canary failure scales its label to 0, so a wifi blip must not fail it: the team's retry (REQ-OPS-21).
            retry curl -fsS -m 10 -o /dev/null https://api.github.com
          else
            /opt/agent-team/claude/current/bin/claude --version
          fi
          git log -1 --format=%h
          # no-wifi: Ollama on the PC itself, checked once: the canary is asking whether it's up.
          if [ "$LABEL" = local-llm ]; then curl -fsS -m 10 http://localhost:11434/api/version; fi
          echo "canary on $LABEL: ok ($(id -un))"
