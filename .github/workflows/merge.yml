# A9 single merge path (REQ-GATE-1, G10). Deterministic verification by
# scripts/gates; the Claude step only executes the merge/update with the Claude
# App token (D11) so the push triggers main-guard. One merge at a time.
name: merge
on:
  workflow_run:
    workflows: [ci, review, security, classify, tier-approval, template-render]
    types: [completed]
  schedule:
    - cron: '41 * * * *'   # this project's slot of the hour (render.js, spec 0.96)
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write
  checks: read
concurrency:
  group: merge          # serial merges (REQ-GATE-1, T17)
  cancel-in-progress: false
jobs:
  plan:
    # A gate run that was skipped or cancelled changed nothing: no key VM for it (team v2.13). Security's
    # comment-triggered runs are skipped dozens of times a day. Schedule and dispatch always plan.
    if: >-
      github.event_name != 'workflow_run' ||
      !contains(fromJSON('["skipped", "cancelled"]'), github.event.workflow_run.conclusion)
    runs-on: [self-hosted, vm-keyed]
    timeout-minutes: 10
    outputs:
      action: ${{ steps.p.outputs.action }}
      pr: ${{ steps.p.outputs.pr }}
      sha: ${{ steps.p.outputs.sha }}
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4   # main: RISK.md, PROJECT.md, gate scripts
        with: { persist-credentials: false }
      - id: p
        run: |
          node scripts/gates/gate.js merge-plan > plan.json
          node -e 'const p=require("./plan.json");for(const r of p.results)console.log(`#${r.number} tier ${r.tier}: ${r.ok?"READY":r.behind?"behind main":r.staleReview?"behind main, review may be stale: updating":r.staleCi?"behind main, ci may be stale: updating to re-run it":r.reasons.join("; ")}`)'
          for k in action pr sha; do echo "$k=$(node -p "require('./plan.json').$k ?? ''")" >> "$GITHUB_OUTPUT"; done
      - if: steps.p.outputs.action == 'merge'
        run: node scripts/gates/gate.js merge-evidence --pr "${{ steps.p.outputs.pr }}" --sha "${{ steps.p.outputs.sha }}"
      - uses: actions/upload-artifact@v4
        with: { name: merge-plan, path: plan.json, retention-days: 30 }

  act:
    needs: plan
    if: needs.plan.outputs.action == 'merge' || needs.plan.outputs.action == 'update'
    runs-on: [self-hosted, vm-keyed]   # holds an App key and runs no model: a key VM (never runs PR or repo code), reverted to its clean snapshot per job (A7 on #23)
    timeout-minutes: 15
    permissions:   # read-only GITHUB_TOKEN for gate.js reads; writes use the App token
      contents: read
      pull-requests: read
      statuses: read
      checks: read
      issues: write   # throttle-check only
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, clean: true }
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A9_APP_ID }}
          private-key: ${{ secrets.A9_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-checks: read
          permission-workflows: write
      - name: Merge or update the branch (fixed script, no model; A7 on #23)
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GATE_READ_TOKEN: ${{ github.token }}
          ACTION: ${{ needs.plan.outputs.action }}
          PR: ${{ needs.plan.outputs.pr }}
          SHA: ${{ needs.plan.outputs.sha }}
        run: |
          [[ "$PR" =~ ^[0-9]+$ ]] || { echo "bad pr"; exit 1; }
          if [ "$ACTION" = merge ]; then
            [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha"; exit 1; }
            node scripts/gates/gate.js merge-execute --pr "$PR" --sha "$SHA"
          else
            node scripts/gates/gate.js update-branch --pr "$PR"
          fi

  notes:
    needs: [plan, act]
    if: needs.plan.outputs.action == 'merge'
    runs-on: [self-hosted, vm-keyed]   # holds an App key and runs no model or repo code beyond the gate scripts on main
    timeout-minutes: 5
    env: { PR: "${{ needs.plan.outputs.pr }}" }
    steps:
      - uses: actions/checkout@v4   # gate.js and .agents/PROJECT.md (manual_checks)
        with: { persist-credentials: false }
      - id: app   # A9's own identity, so the note is posted as the release manager (REQ-ID-4)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A9_APP_ID }}
          private-key: ${{ secrets.A9_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: read
          permission-pull-requests: write
      - name: Owed manual checks (overlay manual_checks)
        env: { GITHUB_TOKEN: "${{ steps.app.outputs.token }}" }
        run: |
          retry() { local i=0 n d e; e=$(mktemp); while :; do "$@" 2>"$e" && { cat "$e" >&2; rm -f "$e"; return 0; }; if grep -qiE 'network is unreachable|no route to host|could not resolve host|no such host|server misbehaving|error connecting to|check your internet connection|connection refused|failed to connect|couldn.t connect|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|connect: ' "$e"; then n=7; elif [ -n "${RETRY_WRITE:-}" ]; then break; elif grep -qiE 'connection reset|ECONNRESET|socket hang up|i/o timeout|TLS handshake timeout|ETIMEDOUT|connection timed out|operation timed out|context deadline exceeded|Client.Timeout|unexpected EOF|SSL_ERROR_SYSCALL|recv failure|send failure' "$e"; then n=7; elif grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|returned error: (429|5[0-9][0-9])|bad gateway|service unavailable|gateway time-?out|something went wrong|rate limit|abuse detection|was submitted too quickly|timed? ?out|EOF' "$e"; then n=3; else break; fi; [ "$i" -lt "$n" ] || break; d=$((2 << i)); [ "$d" -gt 60 ] && d=60; echo "::warning::network call failed, retrying in about ${d}s (spec 1.3, exponential backoff): $1 $2" >&2; sleep $((d / 2 + RANDOM % (d / 2 + 1))); i=$((i + 1)); done; cat "$e" >&2; rm -f "$e"; return 1; }
          FILES=$(retry gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json files -q '.files[].path')
          MSG=$(echo "$FILES" | node scripts/gates/gate.js manual-checks)
          [ -z "$MSG" ] && exit 0
          BODY=$(printf 'ROLE: Release Manager (A9)   ITEM: #%s   RESULT: done\nMerged by merge.yml after verifying all gates (REQ-GATE-1).\nManual checks these hosts cannot run yet:\n%s' "$PR" "$MSG")
          # The merge already happened: a failed note must not turn the run red.
          RETRY_WRITE=1 retry gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "$BODY" || echo "::warning::could not post the owed-checks note on #$PR"
