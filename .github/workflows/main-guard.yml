# REQ-GATE-2 / REQ-CB-5 (non-overridable): every commit on main must be an A9
# merge with gate evidence or an exact revert (scripts/rollback, main-guard).
# Anything else is reverted, labelled `incident`, H is @-mentioned, and the
# autonomy level drops to 0 until the retro closes.
name: main-guard
on:
  push:
    branches: [main]
  schedule:
    - cron: '53 * * * *'   # this project's slot of the hour (render.js); sweep: catches pushes that triggered no workflow (e.g. GITHUB_TOKEN pushes)
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
  statuses: write
  issues: write
  actions: write
concurrency:
  group: main-guard
  cancel-in-progress: false
jobs:
  check:
    runs-on: [self-hosted, vm-keyed]
    timeout-minutes: 15
    outputs:
      violations: ${{ steps.g.outputs.violations }}
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, persist-credentials: false }
      - id: g
        run: |
          if [ "${{ github.event_name }}" = push ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            V=$(node scripts/gates/gate.js guard --before "${{ github.event.before }}" --after "${{ github.event.after }}")
          else
            V=$(node scripts/gates/gate.js guard --sweep)
          fi
          echo "violations=$V" >> "$GITHUB_OUTPUT"
          echo "$V"

  revert:
    needs: check
    if: needs.check.outputs.violations != '[]' && needs.check.outputs.violations != ''
    runs-on: [self-hosted, vm-keyed]   # holds an App key and runs no model: a key VM (never runs PR or repo code), reverted to its clean snapshot per job (A7 on #23)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, persist-credentials: false, clean: true }
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A9_APP_ID }}
          private-key: ${{ secrets.A9_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-checks: read
          permission-workflows: write
      - name: Revert unauthorised commits, newest first (fixed script, no model)
        id: claude
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          V: ${{ needs.check.outputs.violations }}
        run: |
          for sha in $(node -e 'console.log(JSON.parse(process.env.V).map(x=>x.sha).reverse().join(" "))'); do
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "bad sha: $sha"; exit 1; }
            node scripts/gates/gate.js guard-revert --sha "$sha"
          done
      - name: Incident + circuit breaker (REQ-CB-5)
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          V: ${{ needs.check.outputs.violations }}
          REVERTED: ${{ steps.claude.outcome }}
        run: |
          LIST=$(node -e 'console.log(JSON.parse(process.env.V).map(x=>"- "+x.sha.slice(0,7)+": "+x.why).join("\n"))')
          gh issue create -R "$GITHUB_REPOSITORY" --title "Incident: unauthorised change to main" --label incident --label circuit-breaker --label "cb:level-0" --body "$(printf '@delmarolivier main-guard found commits on main outside A9'"'"'s merge path (REQ-GATE-2):\n\n%s\n\nRevert: %s (run %s).\nREQ-CB-5: autonomy drops to **Level 0** while this issue is open. A10 writes the retro; close this issue when the retro is done.\n' "$LIST" "$REVERTED" "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}")" > issue.txt
          N=$(grep -oE '[0-9]+$' issue.txt); cat issue.txt
          gh workflow run retro.yml -R "$GITHUB_REPOSITORY" --ref main -f incident="$N"   # GITHUB_TOKEN-created issues trigger no workflows
