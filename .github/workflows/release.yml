# A9 release (G11) for overlay `deploy: none`: verify main, tag it, and offer
# one-step rollback (REQ-FLOW-4). No flags exist, so there is no staged ramp.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: 'SHA on main to roll back (runs scripts/rollback)'
        required: true
permissions:
  contents: read
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify-and-tag:
    if: github.event_name == 'push'
    permissions: { contents: write }   # tag push only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: Tag the release
        run: |
          TAG="r-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          git tag "$TAG" "$GITHUB_SHA" && git push origin "$TAG"
          echo "Tagged $TAG. Rollback: Actions → release → Run workflow with this SHA, or scripts/rollback $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  rollback:
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, claude-jobs]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, persist-credentials: false, clean: true }
      - id: cmd
        env: { SHA: "${{ inputs.rollback }}" }
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "not a sha: $SHA"; exit 1; }
          echo "run=scripts/rollback $SHA --push" >> "$GITHUB_OUTPUT"
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "github-actions,claude"   # our own automation only (REQ-COMMS-3); incident #16
          prompt: |
            Run exactly this command and report its output. Do nothing else:
            ${{ steps.cmd.outputs.run }}
          claude_args: >-
            --append-system-prompt-file .claude/agents/release-manager.md --model haiku --max-turns 4
            --allowedTools "Bash(${{ steps.cmd.outputs.run }})"
            --disallowedTools "Edit,Write,MultiEdit,NotebookEdit,WebFetch,WebSearch,Task,Read,Grep,Glob"
