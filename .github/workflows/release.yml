# A9 release (G11) for overlay `deploy: none`: verify main, tag it, and offer
# one-step rollback (REQ-FLOW-4). No flags exist, so there is no staged ramp.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rollback:
        description: 'SHA on main to roll back (runs scripts/rollback)'
        required: true
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest   # runs repo code: read-only token, not persisted (REQ-CFG-3)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          : no install_command in the overlay
          npm test
          node --test scripts/gates/*.test.js scripts/agents/*.test.js

  tag:
    needs: verify
    permissions: { contents: write }   # tag push only; runs no repo code
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Tag the release
        run: |
          TAG="r-$(date -u +%Y%m%d)-${GITHUB_SHA:0:7}"
          git tag "$TAG" "$GITHUB_SHA" && git push origin "$TAG"
          echo "Tagged $TAG. Rollback: Actions → release → Run workflow with this SHA, or scripts/rollback $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"

  # The tests run here, with no key: they are repo code (REQ-CFG-3, review of team/v1).
  rollback-test:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      main: ${{ steps.t.outputs.main }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Prepare the revert and run the tests (no push)
        id: t
        env:
          SHA: ${{ inputs.rollback }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "not a sha: $SHA"; exit 1; }
          git config user.name rollback-test && git config user.email rollback-test@localhost
          echo "main=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"
          : no install_command in the overlay
          scripts/rollback "$SHA"

  rollback:
    needs: rollback-test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest   # holds an App key and runs no model: a fresh GitHub-hosted VM per job (A7 on #23)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, fetch-depth: 0, persist-credentials: false, clean: true }
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A9_APP_ID }}
          private-key: ${{ secrets.A9_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: write
          permission-pull-requests: write
          permission-statuses: read
          permission-checks: read
          permission-workflows: write
      - name: Roll back (fixed script, no model, no repo code run)
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          ROLLBACK_SKIP_TEST: '1'
          ROLLBACK_EXPECT_MAIN: ${{ needs.rollback-test.outputs.main }}   # the main the tests ran on
          SHA: ${{ inputs.rollback }}
        run: |
          [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]] || { echo "not a sha: $SHA"; exit 1; }
          git config user.name 'clawworks-release-manager[bot]'
          git config user.email 'clawworks-release-manager[bot]@users.noreply.github.com'
          scripts/rollback "$SHA" --push
