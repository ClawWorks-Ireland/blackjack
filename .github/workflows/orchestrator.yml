# A0 Orchestrator (REQ-CFG-6, spec v0.11): hourly, 24x7, plus events;
# daily digest at 08:00 (REQ-COORD-4). Schedules approved by Delmar at setup.
name: orchestrator
on:
  schedule:
    - cron: '7 * * * *'      # hourly, 24x7, in this project's slot of the hour (render.js); the 08:00 Dublin digest hour is checked below (DST-safe)
  issues:
    types: [opened, labeled, closed]
  pull_request_target:
    types: [closed]
  issue_comment:
    types: [created]   # Delmar's answers to needs-human questions (job filters to the owner)
  workflow_dispatch:
    inputs:
      digest: { description: 'Write the daily digest now', type: boolean, default: false }
permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write
  statuses: read
jobs:
  sweep:
    # Only Delmar's comments start a sweep (answers to needs-human, `re-slice`/`take over` on a PR),
    # not his /security-waive commands. Concurrency is on the job, so a skipped run (a bot comment)
    # never takes the single pending slot from a real one.
    # Its own issue actions (labels the ladder or a sweep adds, issues it opens or closes) don't start
    # another sweep: the next sweep picks them up (template#12 review item 9).
    if: >-
      (github.event_name != 'issue_comment' ||
       (github.event.comment.user.login == 'delmarolivier' && !startsWith(github.event.comment.body, '/security-waive'))) &&
      !(github.event_name == 'issues' && github.event.sender.login == 'clawworks-orchestrator[bot]')
    concurrency:
      group: orchestrator
      cancel-in-progress: false
    runs-on: [self-hosted, claude-jobs]
    timeout-minutes: 30
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, persist-credentials: false, clean: true }
      - id: w
        run: |
          retry() { local i=0 n d e; e=$(mktemp); while :; do "$@" 2>"$e" && { cat "$e" >&2; rm -f "$e"; return 0; }; if grep -qiE 'network is unreachable|no route to host|could not resolve host|no such host|server misbehaving|error connecting to|check your internet connection|connection refused|failed to connect|couldn.t connect|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|connect: ' "$e"; then n=7; elif [ -n "${RETRY_WRITE:-}" ]; then break; elif grep -qiE 'connection reset|ECONNRESET|socket hang up|i/o timeout|TLS handshake timeout|ETIMEDOUT|connection timed out|operation timed out|context deadline exceeded|Client.Timeout|unexpected EOF|SSL_ERROR_SYSCALL|recv failure|send failure' "$e"; then n=7; elif grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|returned error: (429|5[0-9][0-9])|bad gateway|service unavailable|gateway time-?out|something went wrong|rate limit|abuse detection|was submitted too quickly|timed? ?out|EOF' "$e"; then n=3; else break; fi; [ "$i" -lt "$n" ] || break; d=$((2 << i)); [ "$d" -gt 60 ] && d=60; echo "::warning::network call failed, retrying in about ${d}s (spec 1.3, exponential backoff): $1 $2" >&2; sleep $((d / 2 + RANDOM % (d / 2 + 1))); i=$((i + 1)); done; cat "$e" >&2; rm -f "$e"; return 1; }
          # If the digest issue can't be read, skip the digest this run rather than rewrite it blindly.
          # No open digest issue: an empty body, so the digest is due and A0 creates the issue.
          if BODY=$(retry gh issue list -R "$GITHUB_REPOSITORY" --label digest --state open --json body -q '.[0].body // ""'); then
            LAST_DIGEST=$(printf '%s' "$BODY" | node -e 'let b="";process.stdin.on("data",d=>b+=d).on("end",()=>console.log(require("./scripts/gates/lib.js").digestStamp(b)||""))')
          else
            echo "::warning::could not read the digest issue; no digest this run"; DIGEST_UNREADABLE=1
          fi
          export LAST_DIGEST DIGEST_UNREADABLE
          node -e '
            const G=require("./scripts/gates/lib.js"); const h=G.dublinHour();
            const sched=process.env.EV==="schedule";
            console.log("run=true");   // 24x7 (spec v0.11)
            console.log("digest="+(process.env.DIGEST==="true"||(!process.env.DIGEST_UNREADABLE&&G.digestDue(new Date(), process.env.LAST_DIGEST||null))));
            console.log("today="+G.dublinDate());
            console.log("monday="+(new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Dublin",weekday:"short"}).format(new Date())==="Mon"));
          ' >> "$GITHUB_OUTPUT"
          echo "level=$(node scripts/gates/gate.js level)" >> "$GITHUB_OUTPUT"
          echo "throttled=$(retry gh issue list -R "$GITHUB_REPOSITORY" --label throttled --state open --json number -q length)" >> "$GITHUB_OUTPUT"
        env: { EV: "${{ github.event_name }}", DIGEST: "${{ inputs.digest }}", GITHUB_TOKEN: "${{ github.token }}" }
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A0_APP_ID }}
          private-key: ${{ secrets.A0_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: read   # claude-code-action fetches the base branch on PR events (incident #26)
          permission-issues: write
          permission-pull-requests: read
          permission-actions: write
      - name: Freeze the job guard before the model starts (a model edit cannot change it)
        run: |
          cat scripts/agents/policy-guard.js > "$RUNNER_TEMP/job-guard.js"
          # One runner per Linux user (REQ-CFG-3): two runners under one user share ~/.local, and two
          # Claude jobs at once corrupt each other's Claude Code install (blackjack#53). Fail loudly.
          n=$(find "$HOME" -maxdepth 2 -path "$HOME/actions-runner*/.runner" | wc -l)
          if [ "$n" -gt 1 ]; then echo "::error::$n runners are registered under $(id -un): one runner per user (REQ-CFG-3; size the pool with agent-team-pool (scripts/pc/runner-pool.sh in the template))"; exit 1; fi
      - id: claude
        if: steps.w.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /opt/agent-team/claude/current/bin/claude   # the pool's pinned install: no per-job installs (REQ-CFG-3)
          settings: '{"hooks":{"PreToolUse":[{"matcher":"Bash|Read|Grep|Glob","hooks":[{"type":"command","command":"GUARD_MODE=job node \"$RUNNER_TEMP/job-guard.js\""}]}]}}'   # credential reads, gh file flags (REQ-CFG-3)
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "github-actions,clawworks-orchestrator,clawworks-spec-writer,clawworks-planner,clawworks-local-coder,clawworks-claude-coder,clawworks-self-checker,clawworks-bug-hunter,clawworks-finding-checker,clawworks-security-reviewer,clawworks-risk-classifier,clawworks-release-manager,clawworks-incident-reviewer,clawworks-console"   # our own automation only (REQ-COMMS-3)
          prompt: |
            Run the A0 sweep for ${{ github.repository }} (trigger: ${{ github.event_name }}).
            Effective autonomy level: ${{ steps.w.outputs.level }}. Open throttled issues: ${{ steps.w.outputs.throttled }}.
            Write the daily digest this run: ${{ steps.w.outputs.digest }} (Monday metrics: ${{ steps.w.outputs.monday }}).
            The digest is the open pinned issue labelled `digest`. ${{ steps.w.outputs.digest == 'true' && format('When you write it this run, replace its body and make its first line exactly `<!-- digest {0} -->` (that stamp is how the next run knows today''s digest is written).', steps.w.outputs.today) || 'Do not rewrite it this run; if you must edit it, keep its first line (the `<!-- digest … -->` stamp) unchanged.' }} Board status is tracked with `status:*` labels.
            If a throttled issue is open and a Claude run has succeeded since it was opened, close it with the throttled hours.
          claude_args: >-
            --append-system-prompt-file .claude/agents/orchestrator.md --model opus --max-turns 60
            --allowedTools "Read,Grep,Glob,Bash(node scripts/gates/gate.js ladder-resume:*),Bash(node scripts/gates/gate.js slice-check --issue:*),Bash(gh issue list:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh issue create:*),Bash(gh issue close:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(gh run list:*),Bash(gh run view:*),Bash(gh label list:*),Bash(gh workflow run implement.yml:*),Bash(gh workflow run spec-plan.yml:*),Bash(gh api -X GET:*),Bash(node scripts/gates/gate.js level)"
            --disallowedTools "Read(~/actions-runner*/.credentials*),Read(~/actions-runner*/.runner),Read(~/actions-runner*/.env),Read(~/.claude/**),Read(//proc/**),Edit,Write,Bash(gh pr merge:*),Bash(gh pr review:*),Bash(git push:*),SendMessage,ListAgents"
      - name: Team metrics (REQ-OPS-14; no model, read by the health watcher)
        continue-on-error: true   # a metric never fails the job
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          TM_FILE: ${{ steps.claude.outputs.execution_file }}
          TM_ROLE: "orchestrator"
          TM_SUBJECT: "${{ github.event.issue.number || github.event.pull_request.number || '' }}"
          TM_SHA: ""
          TM_ATTEMPT: ""
          TM_ARGS: "opus"
        run: node scripts/gates/gate.js metrics --file "$TM_FILE"
      - name: Make sure today's digest is stamped (fixed step, no model), so it is written once a day
        if: steps.w.outputs.digest == 'true' && steps.claude.outcome == 'success'
        env: { GITHUB_TOKEN: "${{ steps.app.outputs.token }}", TODAY: "${{ steps.w.outputs.today }}" }
        run: |
          retry() { local i=0 n d e; e=$(mktemp); while :; do "$@" 2>"$e" && { cat "$e" >&2; rm -f "$e"; return 0; }; if grep -qiE 'network is unreachable|no route to host|could not resolve host|no such host|server misbehaving|error connecting to|check your internet connection|connection refused|failed to connect|couldn.t connect|ECONNREFUSED|ENOTFOUND|EAI_AGAIN|connect: ' "$e"; then n=7; elif [ -n "${RETRY_WRITE:-}" ]; then break; elif grep -qiE 'connection reset|ECONNRESET|socket hang up|i/o timeout|TLS handshake timeout|ETIMEDOUT|connection timed out|operation timed out|context deadline exceeded|Client.Timeout|unexpected EOF|SSL_ERROR_SYSCALL|recv failure|send failure' "$e"; then n=7; elif grep -qiE 'HTTP 5[0-9][0-9]|HTTP 429|returned error: (429|5[0-9][0-9])|bad gateway|service unavailable|gateway time-?out|something went wrong|rate limit|abuse detection|was submitted too quickly|timed? ?out|EOF' "$e"; then n=3; else break; fi; [ "$i" -lt "$n" ] || break; d=$((2 << i)); [ "$d" -gt 60 ] && d=60; echo "::warning::network call failed, retrying in about ${d}s (spec 1.3, exponential backoff): $1 $2" >&2; sleep $((d / 2 + RANDOM % (d / 2 + 1))); i=$((i + 1)); done; cat "$e" >&2; rm -f "$e"; return 1; }
          N=$(retry gh issue list -R "$GITHUB_REPOSITORY" --label digest --state open --json number -q '.[0].number // ""')
          [ -n "$N" ] || { echo "::warning::no open digest issue"; exit 0; }
          retry gh issue view "$N" -R "$GITHUB_REPOSITORY" --json body -q .body | tr -d '\r' > digest-body.md
          STAMP=$(node -e 'console.log(require("./scripts/gates/lib.js").digestStamp(require("fs").readFileSync("digest-body.md","utf8"))||"")')
          if [ "$STAMP" != "$TODAY" ]; then
            echo "::warning::A0 left the digest without today's stamp; adding it"
            { printf '<!-- digest %s -->\n' "$TODAY"; grep -v '^<!-- digest [0-9-]* -->$' digest-body.md || true; } > digest-new.md   # grep exits 1 on an empty body
            retry gh issue edit "$N" -R "$GITHUB_REPOSITORY" --body-file digest-new.md
          fi
      - if: failure() && steps.claude.outcome == 'failure'
        run: node scripts/gates/gate.js throttle-check --file "${{ steps.claude.outputs.execution_file }}"

  # QA rounds on PR heads (REQ-COORD-10, team v2.32). Model-free: for each open PR whose slice has a `QA:` line and
  # whose ci, ai-review and security are green, set `qa` pending and dispatch qa.yml on its head. A status write is
  # as strong as a key (REQ-CFG-3), so this runs as its own job on a key VM, never in the model's job.
  qa-sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    concurrency:
      group: qa-sweep
      cancel-in-progress: false
    runs-on: [self-hosted, vm-keyed]
    timeout-minutes: 10
    # issues and pull-requests write (#404): a failed round starts its fix round, or the round cap closes the PR.
    permissions: { contents: read, pull-requests: write, issues: write, statuses: write, actions: write }
    steps:
      - uses: actions/checkout@v4   # the gate scripts on main only
        with: { ref: main, persist-credentials: false }
      - env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/gates/gate.js qa-sweep
