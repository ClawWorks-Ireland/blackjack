# A10 Incident & Retro (REQ-IMP-1/3/5, §7.2). On incidents and reverts, and weekly.
name: retro
on:
  issues:
    types: [labeled]
  push:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'   # Mondays ~09:23 Dublin
  workflow_dispatch:
    inputs:
      incident: { description: 'Incident issue number', required: false, default: '' }
permissions:
  contents: read   # A10 pushes branches with the Claude App token, never GITHUB_TOKEN
  issues: write
  pull-requests: write
  actions: read
concurrency:
  group: retro
  cancel-in-progress: false
jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mode: ${{ steps.r.outputs.mode }}
    steps:
      - id: r
        env:
          MSG: ${{ github.event.head_commit.message }}
          LABEL: ${{ github.event.label.name }}
          IN_INCIDENT: ${{ inputs.incident }}
        run: |
          M=""
          case "${{ github.event_name }}" in
            issues) [ "$LABEL" = incident ] && M=incident ;;
            push) printf '%s' "$MSG" | grep -qE '^(Rollback-of|Main-guard-revert): ' && M=revert ;;
            schedule) M=weekly ;;
            workflow_dispatch) [[ -z "$IN_INCIDENT" || "$IN_INCIDENT" =~ ^[0-9]+$ ]] || { echo "bad incident"; exit 1; }; M=$([ -n "$IN_INCIDENT" ] && echo incident || echo weekly) ;;
          esac
          echo "mode=$M" >> "$GITHUB_OUTPUT"
  a10:
    needs: route
    if: needs.route.outputs.mode != ''
    runs-on: [self-hosted, claude-code]   # a model runs code here: never the runner that handles App keys (A7 on #23)
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0, clean: true, persist-credentials: false }
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A10_APP_ID }}
          private-key: ${{ secrets.A10_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "github-actions,clawworks-orchestrator,clawworks-spec-writer,clawworks-planner,clawworks-local-coder,clawworks-claude-coder,clawworks-self-checker,clawworks-bug-hunter,clawworks-finding-checker,clawworks-security-reviewer,clawworks-risk-classifier,clawworks-release-manager,clawworks-incident-reviewer,clawworks-console"   # our own automation only (REQ-COMMS-3)
          prompt: |
            Mode: ${{ needs.route.outputs.mode }}. Incident issue: ${{ inputs.incident || github.event.issue.number || 'find the newest open issue labelled incident' }}. Commit: ${{ github.sha }}.
            Follow your definition. Open proposals as ONE Tier 2 PR from a branch named agent/retro-<date>. Never merge.
          claude_args: >-
            --append-system-prompt-file .claude/agents/incident-retro.md --model opus --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git checkout -b agent/retro-:*),Bash(git add:*),Bash(git commit:*),Bash(git push origin agent/retro-:*),Bash(git log:*),Bash(git diff:*),Bash(gh pr create:*),Bash(gh pr list:*),Bash(gh pr view:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh issue comment:*),Bash(gh issue create:*),Bash(gh run list:*),Bash(gh api -X GET:*),Bash(npm test:*)"
            --disallowedTools "Bash(gh pr merge:*),Bash(gh pr review:*),Bash(git push origin main:*),Bash(git push origin HEAD:main:*)"
      - if: failure() && steps.claude.outcome == 'failure'
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/gates/gate.js throttle-check --file "${{ steps.claude.outputs.execution_file }}"
