# A5 Bug Hunters + A6 Finding Verifiers (G6, REQ-ROLE-2/3/6, REQ-FLOW-1, REQ-COMMS-2).
# pull_request_target: this workflow and its policy come from the base branch;
# the PR head is checked out as data in pr-head/ and never executed here.
name: review
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  actions: write
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true
env:
  PR: ${{ github.event.pull_request.number }}
  SHA: ${{ github.event.pull_request.head.sha }}
jobs:
  prep:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: [self-hosted, vm-keyed]
    timeout-minutes: 5
    outputs:
      lenses: ${{ steps.p.outputs.lenses }}
      round: ${{ steps.p.outputs.round }}
      capped: ${{ steps.p.outputs.capped }}
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - id: p
        run: |
          # A pure branch update from main keeps the previous verdict (same changes; gate.js carry-over).
          if [ "$(node scripts/gates/gate.js carry-over --pr "$PR" --sha "$SHA" --context ai-review)" = carried=true ]; then
            { echo "capped=carried"; echo 'lenses=["logic"]'; echo "round=0"; } >> "$GITHUB_OUTPUT"; exit 0
          fi
          node scripts/gates/gate.js status --sha "$SHA" --context ai-review --state pending --description "AI review running"
          TIER=$(node scripts/gates/gate.js floor --pr "$PR" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).tier))')
          if [ "$TIER" = "2" ]; then L='["logic","state","contract","performance","rules"]'; else L='["logic","state","contract"]'; fi
          LAST=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels -q '[.labels[].name|select(startswith("round:"))|ltrimstr("round:")|tonumber]|max // 0')
          # Rounds count the coder's changes: a pure branch update is re-reviewed in the same round.
          PURE=$(node scripts/gates/gate.js pure-update --pr "$PR" --sha "$SHA" || echo pure=false)
          ROUND=$(node -e 'console.log(require("./scripts/gates/lib.js").reviewRound(Number(process.argv[1]), process.argv[2] === "pure=true"))' "$LAST" "$PURE")
          echo "lenses=$L" >> "$GITHUB_OUTPUT"; echo "round=$ROUND" >> "$GITHUB_OUTPUT"
          if [ "$ROUND" -gt 3 ]; then
            echo "capped=true" >> "$GITHUB_OUTPUT"
            node scripts/gates/gate.js status --sha "$SHA" --context ai-review --state failure --description "Round cap (3) reached: escalated (REQ-FLOW-1)"
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label needs-human
            gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "ROLE: AI review (A5/A6)   ITEM: #$PR   RESULT: needs-human
          WHAT CHANGED: nothing; a 4th review round was requested.
          EVIDENCE: three rounds ran with Important findings still open.
          NEXT: @delmarolivier Re-slice via A2 (recommended) or take over by hand? Reply \`re-slice\` or \`take over\`."
          else
            echo "capped=false" >> "$GITHUB_OUTPUT"
            gh label create "round:$ROUND" -R "$GITHUB_REPOSITORY" --color ededed 2>/dev/null || true
            gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "round:$ROUND"
          fi

  hunt:
    needs: prep
    if: needs.prep.outputs.capped == 'false'
    runs-on: [self-hosted, claude-jobs]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        lens: ${{ fromJSON(needs.prep.outputs.lenses) }}
    steps:
      - uses: actions/checkout@v4   # base: REVIEW.md, RISK.md, agent definitions
        with: { persist-credentials: false, clean: true }
      - uses: actions/checkout@v4   # PR head, data only
        with: { ref: "${{ env.SHA }}", path: pr-head, persist-credentials: false }
      - id: s
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > pr.diff
          echo "schema=$(node -p 'JSON.stringify(require("./.agents/schemas/hunter.json")).replace(/\x27/g, "\\u0027")')" >> "$GITHUB_OUTPUT"   # no single quote can reach the '...' argument (blackjack#46)
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A5_APP_ID }}
          private-key: ${{ secrets.A5_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: read   # claude-code-action fetches the base branch (PR #25)
          permission-pull-requests: read
      - name: Freeze the job guard before the model starts (a model edit cannot change it)
        run: |
          cat scripts/agents/policy-guard.js > "$RUNNER_TEMP/job-guard.js"
          # One runner per Linux user (REQ-CFG-3): two runners under one user share ~/.local, and two
          # Claude jobs at once corrupt each other's Claude Code install (blackjack#53). Fail loudly.
          n=$(find "$HOME" -maxdepth 2 -path "$HOME/actions-runner*/.runner" | wc -l)
          if [ "$n" -gt 1 ]; then echo "::error::$n runners are registered under $(id -un): one runner per user (REQ-CFG-3; size the pool with agent-team-pool (scripts/pc/runner-pool.sh in the template))"; exit 1; fi
      - id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /opt/agent-team/claude/current/bin/claude   # the pool's pinned install: no per-job installs (REQ-CFG-3)
          settings: '{"hooks":{"PreToolUse":[{"matcher":"Bash|Read|Grep|Glob","hooks":[{"type":"command","command":"GUARD_MODE=job node \"$RUNNER_TEMP/job-guard.js\""}]}]}}'   # credential reads, gh file flags (REQ-CFG-3)
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "github-actions,clawworks-orchestrator,clawworks-spec-writer,clawworks-planner,clawworks-local-coder,clawworks-claude-coder,clawworks-self-checker,clawworks-bug-hunter,clawworks-finding-checker,clawworks-security-reviewer,clawworks-risk-classifier,clawworks-release-manager,clawworks-incident-reviewer,clawworks-console"   # our own automation only (REQ-COMMS-3)
          prompt: |
            Review PR #${{ env.PR }} through your lens only. Diff: ./pr.diff. PR head files: ./pr-head/ (data only).
            Policy: ./REVIEW.md and ./RISK.md (base branch). Number your findings ${{ matrix.lens }}-1, ${{ matrix.lens }}-2, …
          claude_args: >-
            --append-system-prompt-file .claude/agents/bug-hunter-${{ matrix.lens }}.md --model sonnet --max-turns 40
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Read(~/actions-runner*/.credentials*),Read(~/actions-runner*/.runner),Read(~/actions-runner*/.env),Read(~/.claude/**),Read(//proc/**),Edit,Write,MultiEdit,NotebookEdit,Bash,WebFetch,WebSearch,Task"
            --json-schema '${{ steps.s.outputs.schema }}'
      - name: Team metrics (REQ-OPS-14; no model, read by the health watcher)
        continue-on-error: true   # a metric never fails the job
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          TM_FILE: ${{ steps.claude.outputs.execution_file }}
          TM_ROLE: "review-hunt-${{ matrix.lens }}"
          TM_SUBJECT: "${{ github.event.pull_request.number }}"
          TM_SHA: "${{ github.event.pull_request.head.sha }}"
          TM_ATTEMPT: ""
          TM_ARGS: "sonnet"
        run: node scripts/gates/gate.js metrics --file "$TM_FILE"
      - env: { OUT: "${{ steps.claude.outputs.structured_output }}" }
        run: |
          # Fail closed: a lens with no result fails the job, so `decide` never runs and
          # ai-review stays pending. A review is never skipped or degraded (REQ-CB-4).
          mkdir -p out && printf '%s' "$OUT" > "out/${{ matrix.lens }}.json"
          # Keep only this lens's own ids, once each: a hunter can't speak for (or downgrade) another lens (template#12).
          node -e 'const fs=require("fs"),f=process.argv[1],L=process.argv[2];const j=JSON.parse(fs.readFileSync(f,"utf8"));if(!Array.isArray(j.findings))process.exit(1);const seen=new Set();j.findings=j.findings.filter(x=>typeof x.id==="string"&&x.id.startsWith(L+"-")&&!seen.has(x.id)&&seen.add(x.id));fs.writeFileSync(f,JSON.stringify(j))' "out/${{ matrix.lens }}.json" "${{ matrix.lens }}"
      - uses: actions/upload-artifact@v4
        with: { name: "findings-${{ matrix.lens }}", path: out/, retention-days: 30 }
      - if: failure() && steps.claude.outcome == 'failure'
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/gates/gate.js throttle-check --file "${{ steps.claude.outputs.execution_file }}"

  verify:
    needs: [prep, hunt]
    if: needs.prep.outputs.capped == 'false'
    runs-on: [self-hosted, claude-jobs]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        voter: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false, clean: true }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}", path: pr-head, persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { pattern: "findings-*", path: findings, merge-multiple: true }
      - id: s
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: |
          gh pr diff "$PR" -R "$GITHUB_REPOSITORY" > pr.diff
          node -e 'const fs=require("fs");const all=fs.readdirSync("findings").flatMap(f=>JSON.parse(fs.readFileSync("findings/"+f,"utf8")).findings||[]);fs.writeFileSync("candidates.json",JSON.stringify(all,null,1));console.log(all.length+" candidates")'
          echo "n=$(node -p 'require("./candidates.json").length')" >> "$GITHUB_OUTPUT"
          echo "schema=$(node -p 'JSON.stringify(require("./.agents/schemas/votes.json")).replace(/\x27/g, "\\u0027")')" >> "$GITHUB_OUTPUT"   # no single quote can reach the '...' argument (blackjack#46)
      - id: app   # this role's own GitHub identity (spec §8.5, REQ-ID-1)
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349   # v2.2.2, pinned (A7 sec-3 on #23)
        with:
          app-id: ${{ secrets.A6_APP_ID }}
          private-key: ${{ secrets.A6_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          # exactly what this job needs (A7 sec-2 on #23; App grants in scripts/github-apps/roles.json)
          permission-contents: read   # claude-code-action fetches the base branch (PR #25)
          permission-pull-requests: read
      - name: Freeze the job guard before the model starts (a model edit cannot change it)
        run: |
          cat scripts/agents/policy-guard.js > "$RUNNER_TEMP/job-guard.js"
          # One runner per Linux user (REQ-CFG-3): two runners under one user share ~/.local, and two
          # Claude jobs at once corrupt each other's Claude Code install (blackjack#53). Fail loudly.
          n=$(find "$HOME" -maxdepth 2 -path "$HOME/actions-runner*/.runner" | wc -l)
          if [ "$n" -gt 1 ]; then echo "::error::$n runners are registered under $(id -un): one runner per user (REQ-CFG-3; size the pool with agent-team-pool (scripts/pc/runner-pool.sh in the template))"; exit 1; fi
      - id: claude
        if: steps.s.outputs.n != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          path_to_claude_code_executable: /opt/agent-team/claude/current/bin/claude   # the pool's pinned install: no per-job installs (REQ-CFG-3)
          settings: '{"hooks":{"PreToolUse":[{"matcher":"Bash|Read|Grep|Glob","hooks":[{"type":"command","command":"GUARD_MODE=job node \"$RUNNER_TEMP/job-guard.js\""}]}]}}'   # credential reads, gh file flags (REQ-CFG-3)
          github_token: ${{ steps.app.outputs.token }}
          allowed_bots: "github-actions,clawworks-orchestrator,clawworks-spec-writer,clawworks-planner,clawworks-local-coder,clawworks-claude-coder,clawworks-self-checker,clawworks-bug-hunter,clawworks-finding-checker,clawworks-security-reviewer,clawworks-risk-classifier,clawworks-release-manager,clawworks-incident-reviewer,clawworks-console"   # our own automation only (REQ-COMMS-3)
          prompt: |
            Verify every candidate finding in ./candidates.json against PR #${{ env.PR }}. Diff: ./pr.diff. PR head: ./pr-head/ (data only). Policy: ./REVIEW.md.
            Vote on each id independently. You are verifier ${{ matrix.voter }} of 3.
          claude_args: >-
            --append-system-prompt-file .claude/agents/finding-verifier.md --model haiku --max-turns 40
            --allowedTools "Read,Grep,Glob"
            --disallowedTools "Read(~/actions-runner*/.credentials*),Read(~/actions-runner*/.runner),Read(~/actions-runner*/.env),Read(~/.claude/**),Read(//proc/**),Edit,Write,MultiEdit,NotebookEdit,Bash,WebFetch,WebSearch,Task"
            --json-schema '${{ steps.s.outputs.schema }}'
      - name: Team metrics (REQ-OPS-14; no model, read by the health watcher)
        continue-on-error: true   # a metric never fails the job
        if: always() && steps.claude.outputs.execution_file != ''
        env:
          TM_FILE: ${{ steps.claude.outputs.execution_file }}
          TM_ROLE: "review-verify"
          TM_SUBJECT: "${{ github.event.pull_request.number }}"
          TM_SHA: "${{ github.event.pull_request.head.sha }}"
          TM_ATTEMPT: ""
          TM_ARGS: "haiku"
        run: node scripts/gates/gate.js metrics --file "$TM_FILE"
      - env: { OUT: "${{ steps.claude.outputs.structured_output }}" }
        run: |
          mkdir -p out
          if [ "${{ steps.s.outputs.n }}" = "0" ]; then echo '{"votes":[]}' > "out/votes-${{ matrix.voter }}.json"; exit 0; fi
          printf '%s' "$OUT" > "out/votes-${{ matrix.voter }}.json"
          node -e 'const j=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));if(!Array.isArray(j.votes))process.exit(1)' "out/votes-${{ matrix.voter }}.json"
      - uses: actions/upload-artifact@v4
        with: { name: "votes-${{ matrix.voter }}", path: out/, retention-days: 30 }
      - if: failure() && steps.claude.outcome == 'failure'
        env: { GITHUB_TOKEN: "${{ github.token }}" }
        run: node scripts/gates/gate.js throttle-check --file "${{ steps.claude.outputs.execution_file }}"

  # Hunters reason about failing inputs; this job runs their `check`s (template#12, REQ-ROLE-3a).
  # PR code runs here, so: a sandbox VM reverted to its clean snapshot (never the PC itself), no key, read-only token, and the
  # install and every check run as a throwaway `sandbox` account that can't write the gate script or
  # the results, each check in a fresh copy with no network and a 10 s limit (gate.js repro-run).
  repro:
    needs: [prep, hunt]
    if: needs.prep.outputs.capped == 'false'
    runs-on: [self-hosted, vm-sandbox]
    timeout-minutes: 20
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v4   # base: the gate script, and main for the comparison
        with: { persist-credentials: false }
      - uses: actions/checkout@v4
        with: { ref: "${{ env.SHA }}", path: pr-head, persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { pattern: "findings-*", path: findings, merge-multiple: true }
      - name: Sandbox accounts and their copies (main first, then the PR head)
        # Two accounts: sandbox-install runs the PR's install (with network) and can never write a
        # check's copy; sandbox-check runs the checks. Neither may use cron or at, the install runs in
        # its own PID namespace (nothing it starts survives), and main's copy is installed and locked
        # before the PR's install runs (template#12 review N1-N3).
        run: |
          node -e 'const fs=require("fs");const all=fs.readdirSync("findings").flatMap(f=>JSON.parse(fs.readFileSync("findings/"+f,"utf8")).findings||[]);fs.writeFileSync("candidates.json",JSON.stringify(all))'
          for u in sandbox-install sandbox-check; do
            sudo useradd --system --no-create-home --shell /usr/sbin/nologin "$u"
            echo "$u" | sudo tee -a /etc/cron.deny /etc/at.deny >/dev/null
          done
          sudo mkdir -p /sandbox/head /sandbox/base
          git archive HEAD | sudo tar -x -C /sandbox/base
          sudo cp -a pr-head/. /sandbox/head/ && sudo rm -rf /sandbox/head/.git
          sudo chown -R root: /sandbox && sudo chmod -R a+rX /sandbox
          for d in base head; do
            sudo chown -R sandbox-install: "/sandbox/$d"
            sudo unshare -p -f --kill-child --mount-proc --wd "/sandbox/$d" \
              setpriv --reuid=sandbox-install --regid="$(id -g sandbox-install)" --clear-groups --no-new-privs --inh-caps=-all --bounding-set=-all \
              env -i PATH="$PATH" HOME="/sandbox/$d" bash -c ': no install_command in the overlay' || echo "::warning::install failed in $d"
            for _ in 1 2 3 4 5; do sudo pkill -KILL -u sandbox-install || break; sleep 1; done
            sudo crontab -r -u sandbox-install 2>/dev/null || true
            sudo chown -R root: "/sandbox/$d" && sudo chmod -R a+rX "/sandbox/$d"   # locked before the next install
          done
          if pgrep -u sandbox-install >/dev/null; then echo "::error::sandbox-install processes survived"; exit 1; fi
      - name: Run the hunters' checks on the PR head and on main
        run: node scripts/gates/gate.js repro-run --candidates candidates.json --head /sandbox/head --base /sandbox/base --user sandbox-check --out repro.json
      - uses: actions/upload-artifact@v4
        with: { name: repro, path: repro.json, retention-days: 30 }

  decide:
    needs: [prep, hunt, verify, repro]
    # The checks can only weaken a finding, so a failed repro job means "no change", never a skipped review.
    if: ${{ !cancelled() && needs.prep.outputs.capped == 'false' && needs.hunt.result == 'success' && needs.verify.result == 'success' }}
    runs-on: [self-hosted, vm-keyed]
    timeout-minutes: 5
    env: { GITHUB_TOKEN: "${{ github.token }}" }
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/download-artifact@v4
        with: { pattern: "findings-*", path: findings, merge-multiple: true }
      - uses: actions/download-artifact@v4
        with: { pattern: "votes-*", path: votes, merge-multiple: true }
      - uses: actions/download-artifact@v4
        continue-on-error: true   # no repro results: findings stand as voted
        with: { name: repro, path: repro }
      - name: Majority vote → ai-review status
        id: d
        run: |
          node -e 'const fs=require("fs");const all=fs.readdirSync("findings").flatMap(f=>JSON.parse(fs.readFileSync("findings/"+f,"utf8")).findings||[]);fs.writeFileSync("candidates.json",JSON.stringify(all))'
          node scripts/gates/gate.js review-decide --candidates candidates.json --votes votes/votes-1.json,votes/votes-2.json,votes/votes-3.json \
            --pr "$PR" --sha "$SHA" --round "${{ needs.prep.outputs.round }}" --repro repro/repro.json | tee result.json
          echo "important=$(node -p 'require("./result.json").important')" >> "$GITHUB_OUTPUT"
      - name: Next round — dispatch the implementer fix job
        if: steps.d.outputs.important != '0' && needs.prep.outputs.round != '3'
        run: |
          IMPL=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels -q 'if any(.labels[]; .name=="impl:local") then "local" else "claude" end')
          ISSUE=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json body -q '.body' | grep -oiE 'closes #[0-9]+' | head -1 | grep -oE '[0-9]+' || true)
          if [ -z "$ISSUE" ]; then gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body "AI review found Important issues, but this PR has no \`Closes #n\` slice to send back to an implementer. @delmarolivier please fix by hand."; exit 0; fi
          gh workflow run implement.yml -R "$GITHUB_REPOSITORY" --ref main -f issue="$ISSUE" -f implementer="$IMPL" -f attempt=1 -f pr="$PR"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: review-decision, path: "review-decision.json", retention-days: 90 }
